<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Símbolo de Paz y Armonía: Flor de Loto Zen y Hojas de Salvia -->
  <g transform="translate(10, 10)">
    <!-- Aura de serenidad / círculo de luz suave -->
    <circle cx="50" cy="50" r="46" fill="#EBF4EE" stroke="#A3C9B2" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="50" cy="50" r="41" fill="#F4FAF6" stroke="#4A7C59" stroke-width="1" opacity="0.6"/>

    <!-- Pétalos exteriores de loto (armonía y balance) -->
    <path d="M50 20 C36 32 30 52 50 78 C70 52 64 32 50 20 Z" fill="url(#gradLotusCenter)" />
    <path d="M50 36 C30 46 20 62 34 78 C46 72 50 62 50 36 Z" fill="url(#gradLotusLeft)" opacity="0.9" />
    <path d="M50 36 C70 46 80 62 66 78 C54 72 50 62 50 36 Z" fill="url(#gradLotusRight)" opacity="0.9" />

    <!-- Pétalos laterales inferiores (calma y estabilidad) -->
    <path d="M50 52 C26 56 16 72 30 84 C44 80 48 70 50 52 Z" fill="#6B9E7F" opacity="0.85" />
    <path d="M50 52 C74 56 84 72 70 84 C56 80 52 70 50 52 Z" fill="#6B9E7F" opacity="0.85" />

    <!-- Hoja de agua / base de soporte zen -->
    <path d="M22 83 C36 89 64 89 78 83 C70 88 50 91 30 88 Z" fill="#3D6352" />
    
    <!-- Gotita de rocío / luz de armonía en el centro -->
    <circle cx="50" cy="48" r="3" fill="#D4AF37" />
    <circle cx="50" cy="38" r="1.5" fill="#FFF8E7" />
  </g>

  <!-- Tipografía de Paz y Armonía -->
  <text x="125" y="48" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#244031" letter-spacing="1.5">
    Salon Spa Aleida
  </text>
  <text x="126" y="74" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4A7C59" letter-spacing="3.5">
    PAZ · ARMONÍA · BIENESTAR
  </text>
  <text x="126" y="94" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#668272" letter-spacing="0.5">
    Centro Terapéutico &amp; Alta Estética
  </text>

  <!-- Gradientes armónicos -->
  <defs>
    <linearGradient id="gradLotusCenter" x1="50" y1="20" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A7C59"/>
      <stop offset="60%" stop-color="#5E8B75"/>
      <stop offset="100%" stop-color="#8BB89C"/>
    </linearGradient>
    <linearGradient id="gradLotusLeft" x1="20" y1="36" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E8B75"/>
      <stop offset="100%" stop-color="#A2CBB2"/>
    </linearGradient>
    <linearGradient id="gradLotusRight" x1="80" y1="36" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E8B75"/>
      <stop offset="100%" stop-color="#A2CBB2"/>
    </linearGradient>
  </defs>
</svg>
